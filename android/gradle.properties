android.useAndroidX=true
# This newDsl flag was added by the Flutter template
# Left off: the installed Flutter SDK's own Gradle plugin doesn't yet read
# AGP 9's new DSL ("class ... cannot be cast to ... AbstractAppExtension"
# applying dev.flutter.flutter-gradle-plugin) — only builtInKotlin is
# needed to fix screen_protector's Kotlin compilation.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# screen_protector's build.gradle only applies the legacy 'kotlin-android'
# plugin when AGP major version < 9 (it's 9.1.1 here) — with this flag off,
# nothing compiled its Kotlin source at all, so ScreenProtectorPlugin never
# got generated ("cannot find symbol" in GeneratedPluginRegistrant.java).
android.builtInKotlin=true
kotlin.incremental=false
